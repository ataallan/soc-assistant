<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI-Powered SOC Assistant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/static/css/soc.css" rel="stylesheet">
</head>
<body class="auth-page">

    <div class="auth-card">
        <img class="auth-logo" src="/static/img/company-logo.png" alt="Company logo" width="88" height="59">
        <div class="auth-brand">AI-Powered <span>SOC Assistant</span></div>
        <div class="auth-owner">Mun Cyber Technologies</div>
        <hr>
        <h3>Register</h3>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <input name="username" class="form-control mb-3" placeholder="Username" required autocomplete="username">
            <input name="password" type="password" class="form-control mb-3" placeholder="Password" required autocomplete="new-password">
            <button class="btn btn-success w-100">Create Account</button>
            <p class="mt-3 text-center mb-0" style="font-size:0.9rem;">
                <a href="/login">Already have an account?</a>
            </p>
        </form>
    </div>


    <footer class="soc-site-footer auth-footer">
  <div class="soc-site-footer-inner footer-centered-stack">
    <nav class="soc-footer-top" aria-label="Footer">
      <a href="/">Home</a>
      <a href="/login">Sign in</a>
      <a href="https://www.muncyber.com/contact.html" target="_blank" rel="noopener noreferrer">Contact</a>
    </nav>
    <div class="soc-footer-copy">Copyright © 2026 Mun Cyber Technologies</div>
    <div class="soc-footer-addr"><a href="https://www.google.com/maps/search/?api=1&amp;query=1705+N+Wieber+Dr+Spokane+WA" target="_blank" rel="noopener noreferrer">1705 N Wieber Dr, Spokane, WA</a></div>
    <nav class="soc-footer-meta" aria-label="Legal">
      <a href="https://www.muncyber.com" target="_blank" rel="noopener noreferrer">muncyber.com</a>
      <span aria-hidden="true">|</span>
      <a href="https://www.muncyber.com/about.html" target="_blank" rel="noopener noreferrer">About</a>
      <span aria-hidden="true">|</span>
      <a href="https://www.muncyber.com/contact.html" target="_blank" rel="noopener noreferrer">Contact</a>
    </nav>
    <div class="soc-footer-social" aria-label="Social media">
      <a class="social-btn" href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">f</a>
      <a class="social-btn" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">ig</a>
      <a class="social-btn" href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">in</a>
      <a class="social-btn" href="https://x.com/" target="_blank" rel="noopener noreferrer" aria-label="X">X</a>
    </div>
  </div>
</footer>

</body>
</html>
