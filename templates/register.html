<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SOC Assistant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/static/css/soc.css" rel="stylesheet">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-brand">SOC <span>Assistant</span></div>
        <hr>
        <h3>Register</h3>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <input name="username" class="form-control mb-3" placeholder="Username" required autocomplete="username">
            <input name="password" type="password" class="form-control mb-3" placeholder="Password" required autocomplete="new-password">
            <button class="btn btn-success w-100">Create Account</button>
            <p class="mt-3 text-center mb-0" style="font-size:0.9rem;">
                <a href="/login">Already have an account?</a>
            </p>
        </form>
    </div>

</body>
</html>
