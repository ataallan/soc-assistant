<!DOCTYPE html>
<html>
<head>
    <title>Register - AI-Powered SOC Assistant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-light">

<div class="container d-flex justify-content-center align-items-center" style="height:100vh;">

    <div class="card p-4 bg-secondary" style="width: 370px;">

        <!-- Added system title -->
        <h4 class="text-center text-light fw-bold mb-1">AI-Powered SOC Assistant</h4>
        <hr class="border-light">

        <h3 class="text-center mb-3">Register</h3>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input name="username" class="form-control mb-3" placeholder="Username" required>
            <input name="password" type="password" class="form-control mb-3" placeholder="Password" required>

            <button class="btn btn-success w-100">Create Account</button>

            <p class="mt-3 text-center">
                <a href="/login" class="text-light">Already have an account?</a>
            </p>
        </form>
    </div>
</div>

</body>
</html>
