<!DOCTYPE html>
<html>
<head>
    <title>Triage Report</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #121212;
            color: #e4e4e4;
        }

        .card {
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
        }

        .card-body {
            color: #e4e4e4;
        }

        .table-container {
            max-height: 70vh;
            overflow-y: auto;
            border-radius: 8px;
        }

        table {
            color: #dcdcdc;
        }

        .table-bordered > :not(caption) > * > * {
            border-color: #333 !important;
        }

        .table-striped > tbody > tr:nth-of-type(odd) {
            background-color: #1b1b1b !important;
        }

        .table-striped > tbody > tr:nth-of-type(even) {
            background-color: #242424 !important;
        }

        thead th {
            position: sticky;
            top: 0;
            background: #0d6efd;
            color: white;
            z-index: 2;
        }

        a.btn-secondary {
            background: #2d2d2d;
            border-color: #3a3a3a;
        }

        a.btn-secondary:hover {
            background: #3a3a3a;
            border-color: #4a4a4a;
        }

        /* Stat Box */
        .stat-box {
            background: #0d6efd;
            border-radius: 6px;
            color: white;
        }
    </style>
</head>

<body class="p-4">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="fw-bold text-light">Triage Report</h3>
    <a href="/" class="btn btn-secondary">← Back</a>
</div>

<div class="card shadow-sm">
    <div class="card-body">

        <!-- Quick Stats -->
        <div class="row mb-3">
            <div class="col-md-3">
                <div class="p-3 stat-box">
                    <h6 class="mb-1">Total Logs/Alerts</h6>
                    <h4>{{ rows|length }}</h4>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="table-container">
            <table class="table table-bordered table-striped mb-0">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Log</th>
                        <th>ML Prediction</th>
                        <th>Rule-Based</th>
                        <th>User</th>
                        <th>IP</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in rows %}
                    <tr>
                        <td>{{ row.timestamp }}</td>
                        <td style="max-width: 450px; white-space: normal;">
                            {{ row.log }}
                        </td>
                        <td>{{ row.ml_prediction }}</td>
                        <td>{{ row.rule_based }}</td>
                        <td>{{ row.user }}</td>
                        <td>{{ row.ip }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

    </div>
</div>

</body>
</html>
