<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} | SOC Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #121212;
            color: #eee;
        }
        .navbar {
            background-color: #1f1f1f !important;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            transition: 0.2s ease-in-out;
        }
        .card:hover {
            transform: scale(1.02);
            border-color: #555;
        }
        .nav-link.active {
            font-weight: bold;
            color: #0d6efd !important;
        }

        /* ------------------ ADVANCED NOTIFICATION PANEL ------------------ */

        .notification-slide {
            width: 320px;
            height: 100vh;
            background: #1e1e1e;
            position: fixed;
            top: 0;
            right: -350px;
            transition: right 0.4s ease;
            z-index: 99999;
            padding: 15px;
            color: white;
            border-left: 2px solid #333;
            overflow-y: auto;
        }
        .notification-slide.visible {
            right: 0;
        }

        #notifHeader {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        #notifCloseBtn {
            cursor: pointer;
            font-size: 28px;
            color: #aaa;
        }
        #notifCloseBtn:hover {
            color: white;
        }

        .notif-button {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #0d6efd;
            color: white;
            border-radius: 40px;
            padding: 12px 20px;
            border: none;
            font-size: 18px;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .notif-controls {
            position: fixed;
            bottom: 25px;
            right: 150px;
            z-index: 9999;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .silence-btn {
            background: #343a40;
            color: #eee;
            border: 1px solid #555;
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.35);
        }
        .silence-btn:hover {
            background: #495057;
        }
        .silence-btn.muted {
            background: #6c757d;
            border-color: #868e96;
        }

        #notifList {
            list-style: none;
            padding-left: 0;
        }
        #notifList li {
            padding: 8px 10px;
            background: #2b2b2b;
            margin-bottom: 6px;
            border-radius: 6px;
            font-size: 14px;
            border-left: 4px solid #0d6efd;
        }
        .critical-li {
            border-left: 4px solid #dc3545 !important;
        }

        .blink-alert {
            animation: blink 0.9s infinite;
        }
        @keyframes blink {
            0% { background-color: #dc3545; }
            50% { background-color: #8b0000; }
            100% { background-color: #dc3545; }
        }
    </style>
</head>

<body>

<!-- 🔔 ADVANCED NOTIFICATION PANEL -->
<div id="advNotificationPanel" class="notification-slide shadow-lg">
    <div id="notifHeader">
        <strong>🔔 SOC Live Alerts</strong>
        <span id="notifCloseBtn">&times;</span>
    </div>

    <div id="notifSummary">
        <p><span id="notifCriticalCount">0</span> Severe Alerts</p>
        <p><span id="notifHighCount">0</span> Escalations</p>
        <p><span id="notifBlockedCount">0</span> Containment</p>
        <p class="mb-2"><button type="button" id="panelSilenceBtn" class="btn btn-sm btn-outline-light">Silence</button></p>
    </div>

    <div id="notifDetails">
        <h6 class="mt-2">Recent Alerts</h6>
        <ul id="notifList"></ul>
    </div>
</div>

<!-- Floating mute + alerts -->
<div class="notif-controls">
    <button type="button" id="silenceAlertsBtn" class="silence-btn" title="Stop sound and flashing">Silence</button>
</div>
<button id="openNotifBtn" class="notif-button">🔔 Alerts</button>

<!-- SOUND (optional file; Web Audio fallback always available) -->
<audio id="alertSound" preload="auto">
    <source src="/static/sounds/alert.wav" type="audio/wav">
    <source src="/static/sounds/alert.mp3" type="audio/mpeg">
</audio>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">SOC Dashboard</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/logs/wazuh">Wazuh Alerts</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/logs/csv">CSV Logs</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/blocks">Containment</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/analytics">Analytics</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/report">Triage Report</a>
                </li>
            </ul>

            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link text-danger" href="/logout">Logout</a>
                </li>
            </ul>

        </div>
    </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container py-4">
    {% block content %}
    {% endblock %}
</div>

<!-- TOAST AREA -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
    <div id="mainToast" class="toast text-bg-success border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body" id="toastMessage">Operation successful.</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Highlight active nav item
    const currentPath = window.location.pathname;
    document.querySelectorAll(".nav-link").forEach(link => {
        if (link.getAttribute("href") === currentPath) {
            link.classList.add("active");
        }
    });

    // Toast function
    function showToast(message, type="success") {
        const toast = document.getElementById("mainToast");
        const msg = document.getElementById("toastMessage");

        toast.classList.remove("text-bg-success", "text-bg-danger", "text-bg-warning");

        if (type === "error") toast.classList.add("text-bg-danger");
        else if (type === "warn") toast.classList.add("text-bg-warning");
        else toast.classList.add("text-bg-success");

        msg.innerText = message;

        const bsToast = new bootstrap.Toast(toast);
        bsToast.show();
    }

    /* -------------------- ADVANCED NOTIFICATION ENGINE -------------------- */

    const MUTE_KEY = "soc_alert_muted";
    let lastSevereCount = 0;
    let recentAlerts = [];
    let audioCtx = null;
    let fileSoundOk = null;

    function isMuted() {
        return localStorage.getItem(MUTE_KEY) === "1";
    }

    function updateMuteButtons() {
        const muted = isMuted();
        const label = muted ? "Unmute" : "Silence";
        ["silenceAlertsBtn", "panelSilenceBtn"].forEach(id => {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.textContent = label;
            btn.classList.toggle("muted", muted);
        });
    }

    function stopAlertEffects() {
        const btn = document.getElementById("openNotifBtn");
        if (btn) btn.classList.remove("blink-alert");
        const severe = document.getElementById("badge-severe");
        if (severe) severe.classList.remove("blink-alert");
        const audio = document.getElementById("alertSound");
        if (audio) {
            try { audio.pause(); audio.currentTime = 0; } catch (e) {}
        }
    }

    function setMuted(muted) {
        if (muted) {
            localStorage.setItem(MUTE_KEY, "1");
            stopAlertEffects();
        } else {
            localStorage.removeItem(MUTE_KEY);
        }
        updateMuteButtons();
    }

    function playWebAudioBeep() {
        try {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return;
            if (!audioCtx) audioCtx = new Ctx();
            if (audioCtx.state === "suspended") audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.value = 880;
            gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.22);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        } catch (e) {
            console.warn("Web Audio beep failed", e);
        }
    }

    function playAlertSound() {
        const audio = document.getElementById("alertSound");
        if (!audio) {
            playWebAudioBeep();
            return;
        }
        if (fileSoundOk === false) {
            playWebAudioBeep();
            return;
        }
        try {
            audio.currentTime = 0;
            const p = audio.play();
            if (p && typeof p.then === "function") {
                p.then(() => { fileSoundOk = true; })
                 .catch(() => {
                     fileSoundOk = false;
                     playWebAudioBeep();
                 });
            }
        } catch (e) {
            fileSoundOk = false;
            playWebAudioBeep();
        }
    }

    function startFlash() {
        const btn = document.getElementById("openNotifBtn");
        if (btn) btn.classList.add("blink-alert");
        const severe = document.getElementById("badge-severe");
        if (severe) severe.classList.add("blink-alert");
    }

    function refreshNotifications() {
        fetch("/notifications")
            .then(r => r.json())
            .then(data => {
                document.getElementById("notifCriticalCount").innerText = data.severe_alerts;
                document.getElementById("notifHighCount").innerText = data.escalated_events;
                document.getElementById("notifBlockedCount").innerText = data.blocked_count;

                const severe = data.severe_alerts || 0;
                const increased = severe > lastSevereCount;
                const muted = isMuted();

                if (muted) {
                    stopAlertEffects();
                } else {
                    if (increased) {
                        playAlertSound();  // once per increase only
                    }
                    if (severe > 0) {
                        startFlash();  // keep flashing until Silence / panel open
                    } else {
                        stopAlertEffects();
                    }
                }

                lastSevereCount = severe;

                if (data.latest_event) {
                    recentAlerts.unshift(data.latest_event);
                    if (recentAlerts.length > 10) recentAlerts.pop();
                }

                let html = "";
                recentAlerts.forEach(e => {
                    let cls = (String(e.severity || "").toLowerCase() === "critical"
                        || String(e.severity || "").toLowerCase() === "high") ? "critical-li" : "";
                    html += `<li class="${cls}">
                                <strong>[${String(e.severity || "info").toUpperCase()}]</strong> ${e.description || ""}
                             </li>`;
                });
                document.getElementById("notifList").innerHTML = html;
            })
            .catch(err => console.warn("notifications poll failed", err));
    }

    // Poll every 3 seconds
    setInterval(refreshNotifications, 3000);
    updateMuteButtons();
    refreshNotifications();

    function openPanelAndQuiet() {
        document.getElementById("advNotificationPanel").classList.add("visible");
        stopAlertEffects();
    }

    document.getElementById("openNotifBtn").onclick = openPanelAndQuiet;
    document.getElementById("notifCloseBtn").onclick = () => {
        document.getElementById("advNotificationPanel").classList.remove("visible");
    };

    function toggleMute() {
        setMuted(!isMuted());
    }
    document.getElementById("silenceAlertsBtn").onclick = toggleMute;
    document.getElementById("panelSilenceBtn").onclick = () => {
        setMuted(true);
        stopAlertEffects();
    };
</script>

</body>
</html>
