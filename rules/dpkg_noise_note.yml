id: DET-PKG-001
name: Routine package manager activity (low)
enabled: true
severity: low
priority: 95
mitre: T1072
conditions:
  - field: text
    op: regex
    value: "(dpkg.*(install|half-configured|configure|status|unpack)|apt(-get)? (install|upgrade|update)|package .*installed|wazuh.*290[24])"
explain: "Routine package manager / dpkg activity on host '{host}' — lab noise; severity stays low/ignore unless unexpected on a locked host."
